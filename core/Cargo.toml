[package]
name = "domi-core"
version = "0.1.0"
edition = "2024"
description = "Platform-agnostic crypto, vault format, and business logic for Domi."
license = "MIT OR Apache-2.0"

[lib]
name = "domi_core"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
getrandom = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1"
