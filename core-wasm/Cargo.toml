[package]
name = "domi-core-wasm"
version = "0.1.0"
edition = "2024"
description = "Thin wasm-bindgen wrapper around domi-core, JSON string boundary."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domi-core = { path = "../core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
