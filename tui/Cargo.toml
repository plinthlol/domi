[package]
name = "fuin-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI shell for Fuin, built on iocraft."
license = "MIT OR Apache-2.0"

[[bin]]
name = "fuin"
path = "src/main.rs"

[dependencies]
fuin-core = { path = "../core" }
iocraft = "0.9.1"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
directories = "5"
zeroize = "1.7"

[dev-dependencies]
futures = "0.3"